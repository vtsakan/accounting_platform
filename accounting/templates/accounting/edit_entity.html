{% extends 'accounting/base.html' %}
{% load greek %}

{% block title %}Επεξεργασία {{ entity.name }}{% endblock %}

{% block content %}
    <h1>Επεξεργασία {{ entity.name }}</h1>

    <form method="post" class="mt-4">
        {% csrf_token %}

        {% include 'accounting/includes/entity_fields.html' %}

        <button type="submit" class="btn btn-primary">Αποθήκευση αλλαγών</button>
        <a href="{% url 'entity-detail' pk=entity.pk %}" class="btn btn-secondary">Ακύρωση</a>
    </form>
{% endblock %}
