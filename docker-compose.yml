name: accounting-platform-dev

services:
  db:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:?Generate .env with tools/init_local_env.py}
      POSTGRES_USER: ${DB_USER:?Generate .env with tools/init_local_env.py}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env with tools/init_local_env.py}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: Europe/Athens
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s

  web:
    image: &dev_app_image ${DEV_APP_IMAGE:-accounting-platform-dev:s26}
    build:
      context: .
      dockerfile: docker/development.Dockerfile
    platform: linux/amd64
    environment: &dev_web_environment
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-false}
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: core.settings.local
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate .env with tools/init_local_env.py}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DB_NAME: ${DB_NAME:?Generate .env with tools/init_local_env.py}
      DB_USER: ${DB_USER:?Generate .env with tools/init_local_env.py}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env with tools/init_local_env.py}
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, jobs]
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - ./accounting:/app/accounting:ro
      - ./core:/app/core:ro
      - ./locale:/app/locale:ro
      - ./templates:/app/templates:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5).close()"]
      interval: 3s
      timeout: 6s
      retries: 30
      start_period: 15s
    stop_grace_period: 15s

  redis:
    profiles: [jobs]
    image: redis:8.2.11-bookworm@sha256:b0b01167ff47bc3868e56a967895a26be4230891a1f42a78ab61cdd227accc8d
    platform: linux/amd64
    command: [redis-server, --bind, 0.0.0.0, --protected-mode, "no", --appendonly, "yes", --appendfsync, everysec, --maxmemory, 96mb, --maxmemory-policy, noeviction]
    volumes: [redis_jobs:/data]
    networks: [jobs]
    mem_limit: 192m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    profiles: [jobs]
    image: *dev_app_image
    platform: linux/amd64
    entrypoint: [python, -m, celery]
    command: [-A, 'core.celery:app', worker, --concurrency=1, --prefetch-multiplier=1, --loglevel=WARNING, --without-gossip, --without-mingle]
    environment:
      <<: *dev_web_environment
      BACKGROUND_JOBS_ENABLED: "true"
    volumes: [./accounting:/app/accounting:ro, ./core:/app/core:ro]
    networks: [default, jobs]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    mem_limit: 512m
    stop_grace_period: 75s
    healthcheck:
      test: [CMD, python, manage.py, background_jobs, health, --component, worker, --strict]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 45s

  scheduler:
    profiles: [jobs]
    image: *dev_app_image
    platform: linux/amd64
    entrypoint: [python, -m, celery]
    command: [-A, 'core.celery:app', beat, --loglevel=WARNING, --pidfile=, --schedule=/app/run/beat/celerybeat-schedule]
    environment:
      <<: *dev_web_environment
      BACKGROUND_JOBS_ENABLED: "true"
    volumes: [./accounting:/app/accounting:ro, ./core:/app/core:ro, scheduler_state:/app/run/beat]
    networks: [default, jobs]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}, worker: {condition: service_started}}
    mem_limit: 192m
    stop_grace_period: 30s
    deploy: {replicas: 1}
    healthcheck:
      test: [CMD, python, manage.py, background_jobs, health, --component, scheduler, --strict]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 30s

volumes:
  # Deliberately new and project-scoped; never reuses the legacy PG15 volume.
  postgres17_data:
  redis_jobs:
  scheduler_state:

networks:
  default: {}
  jobs: {internal: true}
