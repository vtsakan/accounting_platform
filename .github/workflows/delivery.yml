name: Production image and PostgreSQL checks
on:
  push:
    branches: [main, 'step/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build once and verify the same image
        run: python3 tools/verify_delivery.py --report "$RUNNER_TEMP/delivery-verification.json"
      - name: Save the tested image for later deployment
        run: docker image save "accounting-platform:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/accounting-platform-image.tar.gz"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: ${{ runner.temp }}/delivery-verification.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}
          path: ${{ runner.temp }}/accounting-platform-image.tar.gz
          compression-level: 0
          retention-days: 7
