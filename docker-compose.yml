name: accounting-platform-dev

services:
  db:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:?Generate .env with tools/init_local_env.py}
      POSTGRES_USER: ${DB_USER:?Generate .env with tools/init_local_env.py}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env with tools/init_local_env.py}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256 --auth-local=scram-sha-256
      TZ: Europe/Athens
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/development.Dockerfile
    platform: linux/amd64
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.local
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate .env with tools/init_local_env.py}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DB_NAME: ${DB_NAME:?Generate .env with tools/init_local_env.py}
      DB_USER: ${DB_USER:?Generate .env with tools/init_local_env.py}
      DB_PASSWORD: ${DB_PASSWORD:?Generate .env with tools/init_local_env.py}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - ./accounting:/app/accounting:ro
      - ./core:/app/core:ro
      - ./locale:/app/locale:ro
      - ./templates:/app/templates:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=5).close()"]
      interval: 3s
      timeout: 6s
      retries: 30
      start_period: 15s
    stop_grace_period: 15s

volumes:
  # Deliberately new and project-scoped; never reuses the legacy PG15 volume.
  postgres17_data:
