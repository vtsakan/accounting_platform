{% extends 'accounting/auth/base.html' %}
{% block title %}Ανάκτηση πρόσβασης{% endblock %}
{% block auth_content %}
<h1 class="h3">Ανάκτηση κωδικού πρόσβασης</h1>
<p>Συμπληρώστε την ηλεκτρονική διεύθυνση που έχει δηλωθεί στον λογαριασμό σας.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Αίτημα ανάκτησης</button></form>
<p class="mt-3"><a href="{% url 'login' %}">Επιστροφή στη σύνδεση</a></p>
{% endblock %}
