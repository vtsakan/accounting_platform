# Existing synthetic VM only; base production defaults and image inputs stay exact.
services:
  web:
    mem_limit: 1g
    cpus: 2
    environment:
      GUNICORN_WORKERS: "4"
      BACKGROUND_JOBS_ENABLED: "true"
      FEE_AUTOMATION_ENABLED: "true"
  worker:
    environment:
      FEE_AUTOMATION_ENABLED: "true"
  scheduler:
    environment:
      FEE_AUTOMATION_ENABLED: "true"
