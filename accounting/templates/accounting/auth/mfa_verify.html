{% extends 'accounting/auth/base.html' %}
{% block title %}Επαλήθευση σύνδεσης{% endblock %}
{% block auth_content %}<h1 class="h3">Επαλήθευση σύνδεσης</h1><p>Συμπληρώστε τον εξαψήφιο κωδικό από την εφαρμογή επαλήθευσης.</p>
